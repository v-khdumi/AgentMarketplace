name: Deploy Agent Marketplace to Azure

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  NEXT_TELEMETRY_DISABLED: '1'

concurrency:
  group: marketplace-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Compile infrastructure
        run: az bicep build --file infra/main.bicep --outfile infra/azuredeploy.json
      - run: npm run build
      - run: npm run package
      - name: Package validated application
        working-directory: .next/standalone
        run: zip -qr ../../release.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: marketplace-standalone
          path: release.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: marketplace-standalone
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        id: deploy
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: release.zip
      - name: Verify application readiness
        env:
          APP_URL: ${{ steps.deploy.outputs.webapp-url }}
        run: curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 10 "$APP_URL/api/health"
